<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Poches Acides</title>

<style>
body {
  font-family: Arial;
  background: #f2f2f2;
  padding: 10px;
  font-size: 20px;
}

h1 {
  text-align: center;
  font-size: 28px;
}

.tabs {
  display: flex;
  justify-content: center;
  gap: 10px;
  margin-bottom: 10px;
}

.tabs button {
  font-size: 18px;
  padding: 10px 15px;
  border-radius: 10px;
  border: none;
  background: white;
}

.service {
  background: white;
  padding: 12px;
  margin: 15px 0;
  border-radius: 15px;
  box-shadow: 0 2px 5px rgba(0,0,0,0.1);
}

.chariot {
  margin-top: 10px;
  padding: 8px;
  background: #fafafa;
  border-radius: 10px;
}

.row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 18px;
  margin: 10px 0;
  background: white;
  border-radius: 14px;
  cursor: pointer;
}

.row:active {
  background: #dfefff;
}

.label {
  font-size: 20px;
}

.count {
  font-size: 22px;
  min-width: 35px;
  text-align: center;
}

button {
  font-size: 20px;
  padding: 10px 14px;
  border-radius: 10px;
}

.reset {
  background: red;
  color: white;
  width: 100%;
  padding: 15px;
  font-size: 18px;
  border: none;
  border-radius: 12px;
  margin-top: 20px;
}

#stats div {
  padding: 12px;
  margin: 8px;
  background: white;
  border-radius: 10px;
}
</style>
</head>

<body>

<h1>Poches Acides</h1>

<div class="tabs">
  <button onclick="showTab('appTab')">App</button>
  <button onclick="showTab('statsTab')">Stats</button>
</div>

<!-- APP -->
<div id="appTab">
  <div id="app"></div>

  <button class="reset" onclick="resetAll()">RESET APP</button>
</div>

<!-- STATS -->
<div id="statsTab" style="display:none;">
  <h2 style="text-align:center;">Statistiques</h2>
  <div id="stats"></div>

  <button class="reset" onclick="resetStatsOnly()">RESET STATS</button>
</div>

<script>
const data = [
  {
    service: "HD1",
    chariots: [
      { nom: "Chariot 1", acides: ["871","874"] },
      { nom: "Chariot 2", acides: ["468","470"] },
      { nom: "Chariot 3", acides: ["463","460"] }
    ]
  },
  {
    service: "HD2/F",
    chariots: [
      { nom: "Chariot 1", acides: ["463"] },
      { nom: "Chariot 2", acides: ["882","468"] },
      { nom: "Chariot 3", acides: ["871","470"] },
      { nom: "Chariot 4", acides: ["463"] },
      { nom: "Chariot 5", acides: ["460"] },
      { nom: "Chariot 6", acides: ["874"] }
    ]
  },
  {
    service: "HD3/6",
    chariots: [
      { nom: "Chariot 1", acides: ["468","461","462"] },
      { nom: "Chariot 2", acides: ["463","874","871"] },
      { nom: "Chariot 3", acides: ["460"] },
      { nom: "Chariot 4", acides: ["463 3.8L","460 3.8L"] },
      { nom: "Etagère", acides: ["470","468 3.8L","444"] }
    ]
  },
  {
    service: "HD4/5",
    chariots: [
      { nom: "Chariot 1", acides: ["463","468"] },
      { nom: "Chariot 2", acides: ["461","462","871","874","470"] },
      { nom: "Chariot 3", acides: ["460"] }
    ]
  }
];

// 📦 stockage principal
let storage = JSON.parse(localStorage.getItem("acides") || "{}");

// 📦 stockage stats reset (optionnel futur)
let statsStorage = JSON.parse(localStorage.getItem("statsReset") || "{}");

function save() {
  localStorage.setItem("acides", JSON.stringify(storage));
}

function add(id) {
  storage[id] = (storage[id] || 0) + 1;
  update();
}

function remove(id) {
  storage[id] = Math.max(0, (storage[id] || 0) - 1);
  update();
}

function update() {
  document.querySelectorAll("[data-id]").forEach(el => {
    el.innerText = storage[el.dataset.id] || 0;
  });

  save();
  updateStats();
}

/* =========================
   CREATION UI
========================= */
function create() {
  let app = document.getElementById("app");

  data.forEach(service => {
    let section = document.createElement("div");
    section.className = "service";

    let title = document.createElement("h2");
    title.innerText = service.service;
    section.appendChild(title);

    service.chariots.forEach(chariot => {
      let bloc = document.createElement("div");
      bloc.className = "chariot";

      let sub = document.createElement("h3");
      sub.innerText = chariot.nom;
      bloc.appendChild(sub);

      chariot.acides.forEach(code => {

        let id = `${service.service}_${chariot.nom.replace(/\s+/g,'_')}_${code.replace(/\s+/g,'_')}`;

        let row = document.createElement("div");
        row.className = "row";

        row.onclick = () => add(id);

        let left = document.createElement("div");
        left.style.display = "flex";
        left.style.alignItems = "center";
        left.style.gap = "10px";

        let label = document.createElement("div");
        label.className = "label";
        label.innerText = code;

        let count = document.createElement("span");
        count.className = "count";
        count.dataset.id = id;
        count.innerText = storage[id] || 0;

        let minus = document.createElement("button");
        minus.innerText = "-";
        minus.onclick = (e) => {
          e.stopPropagation();
          remove(id);
        };

        left.appendChild(label);
        left.appendChild(count);

        row.appendChild(left);
        row.appendChild(minus);

        bloc.appendChild(row);
      });

      section.appendChild(bloc);
    });

    app.appendChild(section);
  });
}

/* =========================
   STATS
========================= */
function updateStats() {
  let totals = {};

  for (let key in storage) {
    let parts = key.split("_");
    let code = parts[parts.length - 1];

    totals[code] = (totals[code] || 0) + storage[key];
  }

  let statsDiv = document.getElementById("stats");
  statsDiv.innerHTML = "";

  Object.entries(totals)
    .sort((a,b) => b[1] - a[1])
    .forEach(([code, total]) => {
      let div = document.createElement("div");
      div.innerText = `${code} : ${total}`;
      statsDiv.appendChild(div);
    });
}

/* =========================
   TABS
========================= */
function showTab(tab) {
  document.getElementById("appTab").style.display = "none";
  document.getElementById("statsTab").style.display = "none";
  document.getElementById(tab).style.display = "block";
  updateStats();
}

/* =========================
   RESET APP
========================= */
function resetAll() {
  if (confirm("RESET complet de l'application ?")) {
    storage = {};
    save();
    location.reload();
  }
}

/* =========================
   RESET STATS UNIQUEMENT
========================= */
function resetStatsOnly() {
  if (confirm("RESET des statistiques uniquement ?")) {

    // on garde storage intact
    statsStorage = {};
    localStorage.setItem("statsReset", JSON.stringify(statsStorage));

    updateStats();
  }
}

/* =========================
   INIT
========================= */
create();
updateStats();
</script>

</body>
</html>
