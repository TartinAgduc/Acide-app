<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Poches Acides</title>

<style>
body {
  font-family: Arial;
  background: #f2f2f2;
  padding: 10px;
  font-size: 20px;
}

h1 {
  text-align: center;
  font-size: 28px;
}

.tabs {
  display: flex;
  justify-content: center;
  gap: 10px;
  margin-bottom: 10px;
}

.tabs button {
  font-size: 18px;
  padding: 10px 15px;
  border-radius: 10px;
  border: none;
  background: white;
}

.service {
  background: white;
  padding: 12px;
  margin: 15px 0;
  border-radius: 15px;
  box-shadow: 0 2px 5px rgba(0,0,0,0.1);
}

.chariot {
  margin-top: 10px;
  padding: 8px;
  background: #fafafa;
  border-radius: 10px;
}

.row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 18px;
  margin: 10px 0;
  background: white;
  border-radius: 14px;
  cursor: pointer;
}

.label {
  font-size: 20px;
}

.count {
  font-size: 22px;
  min-width: 35px;
  text-align: center;
}

button {
  font-size: 20px;
  padding: 10px 14px;
  border-radius: 10px;
}

.reset {
  background: red;
  color: white;
  width: 100%;
  padding: 15px;
  font-size: 18px;
  border: none;
  border-radius: 12px;
  margin-top: 20px;
}

#stats div {
  padding: 12px;
  margin: 8px;
  background: white;
  border-radius: 10px;
}

/* barres stats */
.bar {
  height: 18px;
  background: #4a90e2;
  border-radius: 6px;
}
</style>
</head>

<body>

<h1>Poches Acides</h1>

<div class="tabs">
  <button onclick="showTab('appTab')">App</button>
  <button onclick="showTab('statsTab')">Stats</button>
</div>

<!-- APP -->
<div id="appTab">
  <div id="app"></div>

  <button class="reset" onclick="resetDay()">RESET JOURNÉE</button>
</div>

<!-- STATS -->
<div id="statsTab" style="display:none;">
  <h2 style="text-align:center;">Statistiques globales</h2>

  <div id="stats"></div>

  <h2 style="text-align:center;">Top du jour</h2>
  <div id="topDay"></div>

  <button class="reset" onclick="resetStats()">RESET STATS GLOBAL</button>
</div>

<script>

/* =========================
   DATA
========================= */
const data = [
  { service:"HD1", chariots:[
    { nom:"Chariot 1", acides:["871","874"] },
    { nom:"Chariot 2", acides:["468","470"] },
    { nom:"Chariot 3", acides:["463","460"] }
  ]},
  { service:"HD2/F", chariots:[
    { nom:"Chariot 1", acides:["463"] },
    { nom:"Chariot 2", acides:["882","468"] },
    { nom:"Chariot 3", acides:["871","470"] },
    { nom:"Chariot 4", acides:["463"] },
    { nom:"Chariot 5", acides:["460"] },
    { nom:"Chariot 6", acides:["874"] }
  ]},
  { service:"HD3/6", chariots:[
    { nom:"Chariot 1", acides:["468","461","462"] },
    { nom:"Chariot 2", acides:["463","874","871"] },
    { nom:"Chariot 3", acides:["460"] }
  ]},
  { service:"HD4/5", chariots:[
    { nom:"Chariot 1", acides:["463","468"] },
    { nom:"Chariot 2", acides:["461","462","871","874","470"] },
    { nom:"Chariot 3", acides:["460"] }
  ]}
];

/* =========================
   STORAGE
========================= */
let daily = JSON.parse(localStorage.getItem("daily") || "{}");
let globalStats = JSON.parse(localStorage.getItem("globalStats") || "{}");

function save(){
  localStorage.setItem("daily", JSON.stringify(daily));
  localStorage.setItem("globalStats", JSON.stringify(globalStats));
}

/* =========================
   ACTIONS
========================= */
function add(id){
  daily[id] = (daily[id] || 0) + 1;
  globalStats[id] = (globalStats[id] || 0) + 1;
  update();
}

function remove(id){
  daily[id] = Math.max(0, (daily[id] || 0) - 1);
  update();
}

/* =========================
   UPDATE UI
========================= */
function update(){
  document.querySelectorAll("[data-id]").forEach(el=>{
    el.innerText = daily[el.dataset.id] || 0;
  });

  save();
  updateStats();
  updateTopDay();
}

/* =========================
   UI BUILD
========================= */
function create(){
  let app = document.getElementById("app");

  data.forEach(service=>{
    let section=document.createElement("div");
    section.className="service";

    let title=document.createElement("h2");
    title.innerText=service.service;
    section.appendChild(title);

    service.chariots.forEach(ch=>{
      let bloc=document.createElement("div");
      bloc.className="chariot";

      let sub=document.createElement("h3");
      sub.innerText=ch.nom;
      bloc.appendChild(sub);

      ch.acides.forEach(code=>{
        let id=`${service.service}_${ch.nom}_${code}`.replace(/\s+/g,"_");

        let row=document.createElement("div");
        row.className="row";
        row.onclick=()=>add(id);

        // LEFT BLOCK
        let left=document.createElement("div");
        left.style.display="flex";
        left.style.alignItems="center";
        left.style.gap="12px";

        // LABEL (acide)
        let label=document.createElement("div");
        label.className="label";
        label.innerText=code;

        // COUNT (badge visuel séparé)
        let count=document.createElement("span");
        count.className="count";
        count.dataset.id=id;
        count.innerText=daily[id]||0;

        // bouton -
        let minus=document.createElement("button");
        minus.innerText="-";
        minus.onclick=(e)=>{
          e.stopPropagation();
          remove(id);
        };

        // AJOUT PROPRE (ordre logique + espace visible)
        left.appendChild(label);
        left.appendChild(count);

        row.appendChild(left);
        row.appendChild(minus);

        bloc.appendChild(row);
      });

      section.appendChild(bloc);
    });

    app.appendChild(section);
  });
}

/* =========================
   STATS GLOBAL
========================= */
function updateStats(){

  let totals={};

  for(let k in globalStats){
    let code=k.split("_").pop();
    let val = Number(globalStats[k]) || 0;

    totals[code]=(totals[code]||0)+val;
  }

  let div=document.getElementById("stats");
  div.innerHTML="";

  Object.entries(totals)
  .sort((a,b)=>b[1]-a[1])
  .forEach(([code,val])=>{

    // 🔥 sécurité iPhone (évite NaN + bloc vide)
    val = Number(val) || 0;

    let boxes = Math.floor(val / 34);
    let pallets = Math.floor(boxes / 4);

    let d=document.createElement("div");
    d.className="statBox";

    d.innerHTML = `
      <b>${code}</b><br>
      ${val} poches<br>
      📦 ${boxes} box(es)<br>
      🧱 ${pallets} palette(s)
    `;

    div.appendChild(d);
  });
}

/* =========================
   TOP DU JOUR
========================= */
function updateTopDay(){
  let totals={};

  for(let k in daily){
    let code=k.split("_").pop();
    totals[code]=(totals[code]||0)+daily[k];
  }

  let div=document.getElementById("topDay");
  div.innerHTML="";

  Object.entries(totals)
  .sort((a,b)=>b[1]-a[1])
  .slice(0,3)
  .forEach(([code,val])=>{
    let d=document.createElement("div");
    d.innerHTML=`🔥 ${code} : ${val}`;
    div.appendChild(d);
  });
}

/* =========================
   TABS
========================= */
function showTab(tab){
  document.getElementById("appTab").style.display="none";
  document.getElementById("statsTab").style.display="none";
  document.getElementById(tab).style.display="block";
}

/* =========================
   RESET JOUR
========================= */
function resetDay(){
  if(confirm("RESET de la journée ?")){
    daily={};
    save();
    location.reload();
  }
}

/* =========================
   RESET STATS
========================= */
function resetStats(){
  if(confirm("RESET des stats globales ?")){
    globalStats={};
    save();
    updateStats();
  }
}

/* =========================
   INIT
========================= */
create();
update();
</script>

</body>
</html>
