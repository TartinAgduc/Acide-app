<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Poches Acides</title>

<style>
body {
  font-family: Arial;
  background:#f2f2f2;
  padding:10px;
}

h1 {
  text-align:center;
}

.service {
  background:white;
  padding:12px;
  margin:15px 0;
  border-radius:15px;
  box-shadow:0 2px 5px rgba(0,0,0,0.1);
}

.chariot {
  margin-top:10px;
  padding:8px;
  background:#fafafa;
  border-radius:10px;
}

.row {
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:8px;
  margin:5px 0;
  background:white;
  border-radius:10px;
}

.label {
  font-size:18px;
  flex:1;
}

.count {
  font-size:18px;
  width:30px;
  text-align:center;
}

button {
  font-size:20px;
  padding:6px 12px;
  margin:0 3px;
}

.reset {
  background:red;
  color:white;
  width:100%;
  padding:15px;
  font-size:18px;
  border:none;
  border-radius:12px;
  margin-top:20px;
}
</style>
</head>

<body>

<h1>Poches Acides</h1>
<div id="app"></div>
<button class="reset" onclick="resetAll()">RESET</button>

<script>
const data = [
  {
    service: "HD1",
    chariots: [
      { nom: "Chariot 1", acides: ["871","874"] },
      { nom: "Chariot 2", acides: ["468","470"] },
      { nom: "Chariot 3", acides: ["463","460"] }
    ]
  },
  {
    service: "HD2/F",
    chariots: [
      { nom: "Chariot 1", acides: ["463"] },
      { nom: "Chariot 2", acides: ["882","468"] },
      { nom: "Chariot 3", acides: ["871","470"] },
      { nom: "Chariot 4", acides: ["463"] },
      { nom: "Chariot 5", acides: ["460"] },
      { nom: "Chariot 6", acides: ["874"] }
    ]
  },
  {
    service: "HD3/6",
    chariots: [
      { nom: "Chariot 1", acides: ["468","461","462"] },
      { nom: "Chariot 2", acides: ["463","874","871"] },
      { nom: "Chariot 3", acides: ["460"] },
      { nom: "Chariot 4", acides: ["463 3.8L","460 3.8L"] },
      { nom: "Etagère", acides: ["470","468 3.8L","444"] }
    ]
  },
  {
    service: "HD4/5",
    chariots: [
      { nom: "Chariot 1", acides: ["463","468"] },
      { nom: "Chariot 2", acides: ["461","462","871","874","470"] },
      { nom: "Chariot 3", acides: ["460"] }
    ]
  }
];

let storage = JSON.parse(localStorage.getItem("acides") || "{}");

function save(){
  localStorage.setItem("acides", JSON.stringify(storage));
}

function add(id){
  storage[id]=(storage[id]||0)+1;
  update();
}

function remove(id){
  storage[id]=Math.max(0,(storage[id]||0)-1);
  update();
}

function update(){
  document.querySelectorAll("[data-id]").forEach(el=>{
    el.innerText = storage[el.dataset.id] || 0;
  });
  save();
}

function create(){
  let app = document.getElementById("app");

  data.forEach(service=>{
    let section = document.createElement("div");
    section.className = "service";

    let title = document.createElement("h2");
    title.innerText = service.service;
    section.appendChild(title);

    service.chariots.forEach(chariot=>{
      let bloc = document.createElement("div");
      bloc.className = "chariot";

      let sub = document.createElement("h3");
      sub.innerText = chariot.nom;
      bloc.appendChild(sub);

      chariot.acides.forEach(code=>{
        let id = service.service + "_" + chariot.nom + "_" + code;

        let row = document.createElement("div");
        row.className = "row";

        let label = document.createElement("div");
        label.className = "label";
        label.innerText = code;
        label.onclick=()=>add(id);

        let minus = document.createElement("button");
        minus.innerText="-";
        minus.onclick=()=>remove(id);

        let count = document.createElement("span");
        count.className = "count";
        count.dataset.id=id;
        count.innerText=storage[id]||0;

        let plus = document.createElement("button");
        plus.innerText="+";
        plus.onclick=()=>add(id);

        let left = document.createElement("div");
        left.style.display = "flex";
        left.style.alignItems = "center";
        left.style.gap = "10px";

        left.appendChild(label);
        left.appendChild(count);

        let right = document.createElement("div");
        right.appendChild(minus);
        right.appendChild(plus);

        row.appendChild(left);
        row.appendChild(right);

        bloc.appendChild(row);
      });

      section.appendChild(bloc);
    });

    app.appendChild(section);
  });
}

function resetAll(){
  if(confirm("Tout remettre à zéro ?")){
    storage={};
    save();
    location.reload();
  }
}

create();
</script>

</body>
</html>
